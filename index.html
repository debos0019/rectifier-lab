<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rectifier Lab</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2330;--mut:#667085;--bd:#d9dee6;--ac:#2563eb;--on:#16a34a;--c1:#dc2626;--c2:#16a34a;--c3:#2563eb;--co:#d97706;--ci:#7c3aed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131a;--card:#171e28;--tx:#e6eaf0;--mut:#93a0b3;--bd:#2b3544;--ac:#60a5fa;--on:#4ade80;--c1:#f87171;--c2:#4ade80;--c3:#60a5fa;--co:#fbbf24;--ci:#a78bfa}}
:root[data-theme="dark"]{--bg:#0e131a;--card:#171e28;--tx:#e6eaf0;--mut:#93a0b3;--bd:#2b3544;--ac:#60a5fa;--on:#4ade80;--c1:#f87171;--c2:#4ade80;--c3:#60a5fa;--co:#fbbf24;--ci:#a78bfa}
*{box-sizing:border-box}html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mut);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.ctl label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:7px 4px;border:0;background:transparent;color:var(--tx);cursor:pointer;font:inherit}
.seg button.on{background:var(--ac);color:#fff}
input[type=range]{width:100%;accent-color:var(--ac)}
.v{float:right;color:var(--tx);font-weight:600}
canvas{width:100%;display:block}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.grid{grid-template-columns:5fr 6fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:8px}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:7px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer;font:inherit}
.live{font-variant-numeric:tabular-nums;color:var(--mut)}.live b{color:var(--tx)}
</style></head><body><div class="wrap">
<h1>Rectifier Lab</h1><p class="sub">Diode &amp; thyristor rectifiers · single-phase &amp; three-phase · half-wave &amp; full-wave. Drag on the waveforms to scrub.</p>
<div class="card ctl">
<div><label>Supply</label><div class="seg" id="ph"><button data-v="1" class="on">Single-phase</button><button data-v="3">Three-phase</button></div></div>
<div><label>Rectifier</label><div class="seg" id="type"><button data-v="half">Half-wave</button><button data-v="full" class="on">Full-wave</button></div></div>
<div><label>Device</label><div class="seg" id="dev"><button data-v="diode" class="on">Diode</button><button data-v="thy">Thyristor</button></div></div>
<div id="aw"><label>Firing angle α <span class="v" id="alv">30°</span></label><input type="range" id="alpha" min="0" max="180" value="30"></div>
<div><label>Peak phase voltage <span class="v" id="Vmv">100 V</span></label><input type="range" id="Vm" min="20" max="400" value="100"></div>
<div><label>Resistance R <span class="v" id="Rv">10 Ω</span></label><input type="range" id="R" min="1" max="50" value="10"></div>
<div><label>Inductance L <span class="v" id="Lv">0 mH</span></label><input type="range" id="L" min="0" max="500" value="0"></div>
<div><label>Freewheeling diode</label><label style="color:var(--tx)"><input type="checkbox" id="fw"> across load</label></div>
</div>
<div class="grid">
<div class="card"><canvas id="sc"></canvas><div class="live" id="live" style="margin-top:6px"></div></div>
<div class="card"><canvas id="wv"></canvas>
<div class="row" style="margin-top:8px"><button class="btn" id="play">⏸ Pause</button><label style="color:var(--mut)">Speed <input type="range" id="spd" min="1" max="20" value="6" style="width:110px"></label></div></div>
</div>
<div class="card stats" id="stats"></div>
</div>
<script>
const $=id=>document.getElementById(id),D=Math.PI/180;
const S={ph:'1',type:'full',dev:'diode',alpha:30,Vm:100,R:10,L:0,fw:false};
let c,col,Rz,cur=0,playing=true,TP;
const NM=[['1','3','5','4','6','2']];
function topo(){
 if(S.ph==='1')return S.type==='half'?{n:1,W:180,phi:[0],dev:[[0]],V:(k,t)=>Math.sin(t)}:{n:2,W:180,phi:[0,180],dev:[[1,2],[0,3]],V:(k,t)=>k?-Math.sin(t):Math.sin(t)};
 if(S.type==='half')return{n:3,W:120,phi:[30,150,270],dev:[[0],[1],[2]],V:(k,t)=>Math.sin(t-k*120*D)};
 const P=[[0,1],[0,2],[1,2],[1,0],[2,0],[2,1]];
 return{n:6,W:60,phi:P.map((_,k)=>30+60*k),dev:P.map(p=>[p[0],3+p[1]]),V:(k,t)=>Math.sin(t-P[k][0]*120*D)-Math.sin(t-P[k][1]*120*D)};
}
function sim(){
 TP=topo();const Vm=S.Vm,R=S.R,L=S.L*1e-3,st0=1440,tot=st0*6,start=st0*4,dth=360/st0,dt=1/50/st0,a=S.dev==='thy'?S.alpha:0;
 let i=0,st=-1;const o={vo:[],io:[],st:[],vin:S.ph==='1'?[[]]:[[],[],[]]};
 for(let s=0;s<tot;s++){
  const th=(s*dth)%360,t=th*D;
  const el=k=>S.dev==='diode'||(((th-TP.phi[k]-a)%360+360)%360<TP.W);
  let bv=st>=0?Vm*TP.V(st,t):0,b=-1;
  for(let k=0;k<TP.n;k++)if(el(k)){const v=Vm*TP.V(k,t);if(v>bv+1e-9){bv=v;b=k}}
  if(b>=0)st=b;
  let vo=st>=0?Vm*TP.V(st,t):0;
  if(S.fw&&vo<0&&i>0){st=-1;vo=0}
  if(L<1e-6){if(vo>0)i=vo/R;else{i=0;st=-1;vo=0}}
  else{const ii=vo/R;i=ii+(i-ii)*Math.exp(-R*dt/L);if(i<=1e-9){i=0;st=-1;vo=0}}
  if(s>=start){o.vo.push(vo);o.io.push(i);o.st.push(st);
   if(S.ph==='1')o.vin[0].push(Vm*Math.sin(t));else for(let p=0;p<3;p++)o.vin[p].push(Vm*Math.sin(t-p*120*D))}
 }
 const n=o.vo.length,m=x=>x.reduce((p,q)=>p+q,0)/n,rms=x=>Math.sqrt(x.reduce((p,q)=>p+q*q,0)/n);
 o.A={va:m(o.vo),vr:rms(o.vo),ia:m(o.io),ir:rms(o.io),zero:o.io.filter(x=>x<=0).length/n};
 Rz=o;draw();stats();
}
function stats(){
 const A=Rz.A,md=A.zero>.999?'No conduction':A.zero>.001?'Discontinuous':'Continuous';
 const f=(l,v,u)=>`<div class="stat"><span>${l}</span><b>${v}${u}</b></div>`;
 $('stats').innerHTML=f('Vo average',A.va.toFixed(1),' V')+f('Vo RMS',A.vr.toFixed(1),' V')+f('Io average',A.ia.toFixed(2),' A')+f('Io RMS',A.ir.toFixed(2),' A')+f('Form factor',A.va>.01?(A.vr/A.va).toFixed(2):'–','')+f('Conduction',md,'');
}
function getCol(){const s=getComputedStyle(document.documentElement),g=n=>s.getPropertyValue(n).trim();col={};['tx','mut','bd','card','on','c1','c2','c3','co','ci','ac'].forEach(n=>col[n]=g('--'+n))}
function fit(cv,w,h){const d=devicePixelRatio||1;cv.width=w*d;cv.height=h*d;cv.style.height=h+'px';const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return x}
const SW=540,SH=290;
function geo(){
 const ys3=[60,140,220],G={w:[],d:[],s:[],dots:[]};
 if(S.ph==='1'&&S.type==='half'){G.w=[[[60,128],[60,100],[118,100]],[[162,100],[400,100],[400,115]],[[400,185],[400,200],[60,200],[60,172]]];G.s=[[60,150,'vs']];G.d=[[140,100,0,0,-16,0]];G.L=[400,150];G.fx=[330,100,200]}
 else if(S.ph==='1'){G.w=[[[50,128],[50,25],[380,25],[380,150]],[[50,172],[50,190],[150,190],[150,150]],[[150,150],[265,70],[380,150],[265,230],[150,150]],[[265,70],[470,70],[470,115]],[[470,185],[470,230],[265,230]]];G.s=[[50,150,'vs']];
  G.d=[[207,110,-34.8,-26,-14,0],[322,110,-145.2,26,-14,1],[207,190,-145.2,-26,26,2],[322,190,-34.8,26,26,3]];G.L=[470,150];G.fx=[420,70,230]}
 else if(S.type==='half'){ys3.forEach((y,k)=>{G.w.push([[82,y],[128,y]],[[172,y],[240,y]],[[20,y],[38,y]]);G.s.push([60,y,'abc'[k]]);G.d.push([150,y,0,0,-16,k])});
  G.w.push([[240,60],[240,220]],[[240,140],[470,140]],[[470,210],[470,270],[20,270],[20,60]]);G.L=[470,175];G.fx=[400,140,270];G.dots=[[240,140]]}
 else{ys3.forEach((y,k)=>G.s.push([60,y,'abc'[k]]));
  G.w=[[[20,60],[20,220]],[[20,60],[38,60]],[[20,140],[38,140]],[[20,220],[38,220]],[[82,70-10],[110,60],[110,125],[190,125]],[[82,140],[130,140],[130,140],[260,140]],[[82,220],[150,220],[150,155],[330,155]],[[190,30],[470,30],[470,105]],[[190,250],[470,250],[470,175]]];
  G.w[4]=[[82,60],[110,60],[110,125],[190,125]];
  [190,260,330].forEach((x,k)=>{G.w.push([[x,30],[x,250]]);G.d.push([x,75,-90,14,4,k],[x,205,-90,14,4,3+k]);G.dots.push([x,[125,140,155][k]])});
  G.d.sort((p,q)=>p[5]-q[5]);G.L=[470,140];G.fx=[410,30,250]}
 return G;
}
function dev(x,y,ang,lx,ly,on,name){
 c.save();c.translate(x,y);c.rotate(ang*D);c.lineWidth=2;c.fillStyle=col.card;c.fillRect(-9,-12,18,24);
 const k=on?col.on:col.tx;c.strokeStyle=c.fillStyle=k;
 c.beginPath();c.moveTo(-22,0);c.lineTo(-9,0);c.moveTo(9,0);c.lineTo(22,0);c.moveTo(9,-9);c.lineTo(9,9);c.stroke();
 c.beginPath();c.moveTo(-9,-9);c.lineTo(-9,9);c.lineTo(9,0);c.closePath();on?c.fill():c.stroke();
 if(S.dev==='thy'&&name[0]!=='D'||(S.dev==='thy'&&name!=='Df')){c.beginPath();c.moveTo(2,5);c.lineTo(11,14);c.lineTo(19,14);c.stroke()}
 c.restore();c.fillStyle=on?col.on:col.mut;c.font='600 11px system-ui';c.textAlign='center';c.fillText(name,x+lx,y+ly)
}
function schem(k){
 const G=geo(),st=Rz.st[k],io=Rz.io[k],vo=Rz.vo[k],act=st>=0?TP.dev[st]:[];
 c.lineWidth=2;c.strokeStyle=col.mut;c.lineJoin='round';
 const poly=p=>{c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke()};
 G.w.forEach(poly);const f=G.fx;poly([[f[0],f[1]],[f[0],f[2]]]);
 [[f[0],f[1]],[f[0],f[2]]].concat(G.dots).forEach(q=>{c.fillStyle=col.mut;c.beginPath();c.arc(q[0],q[1],3,0,7);c.fill()});
 G.s.forEach(s=>{c.fillStyle=col.card;c.strokeStyle=col.tx;c.beginPath();c.arc(s[0],s[1],22,0,7);c.fill();c.stroke();c.beginPath();for(let u=-10;u<=10;u++)c.lineTo(s[0]+u,s[1]-6*Math.sin(u*Math.PI/10));c.stroke();
  c.fillStyle=col.mut;c.font='12px system-ui';c.textAlign='center';c.fillText(s[2],s[0],s[1]+38)});
 const th=S.dev==='thy'?'T':'D',nm=S.ph==='3'&&S.type==='full'?NM[0]:['1','2','3','4'];
 G.d.forEach(d=>dev(d[0],d[1],d[2],d[3],d[4],act.includes(d[5]),th+nm[d[5]]));
 if(S.fw){const on=st<0&&io>0;dev(f[0],(f[1]+f[2])/2,-90,18,4,on,'Df')}
 const L=G.L;c.fillStyle=col.card;c.strokeStyle=io>0?col.co:col.tx;c.lineWidth=2.5;c.fillRect(L[0]-17,L[1]-35,34,70);c.strokeRect(L[0]-17,L[1]-35,34,70);
 c.fillStyle=col.tx;c.font='600 12px system-ui';c.textAlign='center';c.fillText('R',L[0],L[1]-4);if(S.L>0)c.fillText('+ L',L[0],L[1]+12);
 c.fillStyle=col.co;c.fillText('Io '+io.toFixed(1)+' A',L[0]-6,L[1]+54);
 c.fillStyle=col.mut;c.fillText('Vo',L[0]+30,L[1]-40);
}
let W=600,H=480,pl=54,pr=12;
function panel(p,ser,lo,hi,title,avg,k){
 const ph=(H-30)/3,y0=8+p*(ph+8),x0=pl,x1=W-pr,Y=v=>y0+ph-(v-lo)/(hi-lo)*ph,n=ser[0].a.length,X=i=>x0+i/(n-1)*(x1-x0);
 c.lineWidth=1;c.strokeStyle=col.bd;c.strokeRect(x0,y0,x1-x0,ph);c.fillStyle=col.mut;c.font='10px system-ui';c.textAlign='center';
 for(let g=0;g<=8;g++){const x=x0+g/8*(x1-x0);c.beginPath();c.moveTo(x,y0);c.lineTo(x,y0+ph);c.stroke();if(p==2&&g%2==0)c.fillText(g*90+'°',x,y0+ph+12)}
 c.strokeStyle=col.mut;c.beginPath();c.moveTo(x0,Y(0));c.lineTo(x1,Y(0));c.stroke();
 c.textAlign='right';[lo,0,hi].forEach(v=>c.fillText(Math.round(v*10)/10,x0-4,Y(v)+3));
 c.fillStyle=col.tx;c.textAlign='left';c.font='600 11px system-ui';c.fillText(title,x0+6,y0+13);
 ser.forEach(s=>{c.strokeStyle=s.c;c.lineWidth=2;c.beginPath();for(let i=0;i<n;i+=2)c.lineTo(X(i),Y(s.a[i]));c.stroke()});
 if(avg!=null){c.setLineDash([5,4]);c.strokeStyle=col.mut;c.lineWidth=1.5;c.beginPath();c.moveTo(x0,Y(avg));c.lineTo(x1,Y(avg));c.stroke();c.setLineDash([]);c.fillStyle=col.mut;c.textAlign='right';c.fillText('avg '+avg.toFixed(1),x1-4,Y(avg)-4)}
 const cx=X(k);c.strokeStyle=col.ac;c.lineWidth=1.5;c.beginPath();c.moveTo(cx,y0);c.lineTo(cx,y0+ph);c.stroke();
 ser.forEach(s=>{c.fillStyle=s.c;c.beginPath();c.arc(cx,Y(s.a[k]),3.5,0,7);c.fill()});
}
function waves(k){
 const A=Rz,vm=S.Vm*1.1,mx=Math.max(...A.vo),mi=Math.min(...A.vo),mI=Math.max(...A.io);
 panel(0,A.vin.map((a,i)=>({a,c:[col.c1,col.c2,col.c3][i]})),-vm,vm,S.ph==='1'?'Input voltage vs (V)':'Input phase voltages va, vb, vc (V)',null,k);
 panel(1,[{a:A.vo,c:col.co}],Math.min(0,mi*1.1),Math.max(vm,mx*1.1),'Output voltage Vo (V)',A.A.va,k);
 panel(2,[{a:A.io,c:col.ci}],0,Math.max(1,mI*1.15),'Load current Io (A)',A.A.ia,k);
}
function draw(){
 getCol();if(!Rz)return;const k=Math.min(cur|0,Rz.vo.length-1);
 c=$('sc').getContext('2d');c.clearRect(0,0,SW,SH);schem(k);
 c=$('wv').getContext('2d');c.clearRect(0,0,W,H);waves(k);
 const st=Rz.st[k],act=st>=0?TP.dev[st]:[],th=S.dev==='thy'?'T':'D',nm=S.ph==='3'&&S.type==='full'?NM[0]:['1','2','3','4'];
 $('live').innerHTML=`θ <b>${(k*.25%360).toFixed(0)}°</b> · Vo <b>${Rz.vo[k].toFixed(1)} V</b> · Io <b>${Rz.io[k].toFixed(2)} A</b> · conducting: <b>${act.length?act.map(i=>th+nm[i]).join(', '):(S.fw&&Rz.io[k]>0?'Df':'none')}</b>`;
}
function resize(){
 const s=$('sc'),w=s.parentElement.clientWidth-24;const x=fit(s,SW,SH);s.style.width='100%';s.style.height=(w*SH/SW)+'px';
 W=$('wv').parentElement.clientWidth-24;H=Math.max(380,Math.min(520,W*.8));fit($('wv'),W,H);$('wv').style.width=W+'px';draw();
}
function frame(){if(playing&&Rz){cur=(cur+ +$('spd').value*.8)%Rz.vo.length;draw()}requestAnimationFrame(frame)}
document.querySelectorAll('.seg').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S[g.id]=b.dataset.v;upd()});
const U={alpha:'°',Vm:' V',R:' Ω',L:' mH'};
['alpha','Vm','R','L'].forEach(id=>$(id).oninput=()=>{S[id]=+$(id).value;upd()});
$('fw').onchange=()=>{S.fw=$('fw').checked;upd()};
function upd(){$('alv').textContent=S.alpha+'°';$('Vmv').textContent=S.Vm+' V';$('Rv').textContent=S.R+' Ω';$('Lv').textContent=S.L+' mH';$('aw').style.opacity=S.dev==='thy'?1:.4;sim()}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸ Pause':'▶ Play'};
const scrub=e=>{const r=$('wv').getBoundingClientRect(),f=(e.clientX-r.left-pl)/(W-pl-pr);cur=Math.max(0,Math.min(1,f))*(Rz.vo.length-1);playing=false;$('play').textContent='▶ Play';draw()};
$('wv').onpointerdown=e=>{$('wv').setPointerCapture(e.pointerId);scrub(e)};$('wv').onpointermove=e=>{if(e.buttons)scrub(e)};$('wv').style.touchAction='none';
addEventListener('resize',resize);matchMedia('(prefers-color-scheme:dark)').onchange=draw;
upd();resize();frame();
</script></body></html>
